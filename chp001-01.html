<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>幕间剧场 · THE THEATRE OF ILLUSION</title>
<style>
  /* ==================== 全局 ==================== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0806;
    font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", "Times New Roman", serif;
    touch-action: manipulation;
    user-select: none;
  }

  /* ==================== 游戏容器 ==================== */
  #game {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0a0806;
  }

  /* ==================== 背景层 ==================== */
  #bg-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: opacity 0.6s ease;
    z-index: 0;
  }

  /* 背景暗角 + 暖色滤镜：剧场舞台感 */
  #bg-vignette {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,0.72) 100%),
      linear-gradient(180deg, rgba(10,8,6,0.35) 0%, rgba(10,8,6,0) 30%, rgba(10,8,6,0) 65%, rgba(10,8,6,0.85) 100%);
  }

  #bg-layer.fallback {
    background: linear-gradient(160deg, #1a1208 0%, #2a1a0a 40%, #0a0806 100%);
  }

  /* ==================== 角色立绘 ==================== */
  #chara-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 5;
  }

  .chara-slot {
    position: absolute;
    bottom: 0;
    height: 88%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
    will-change: opacity;
  }

  #chara-left  { left: 2%; }
  #chara-right { right: 2%; }

  .chara-slot.visible { opacity: 1; }

  .chara-img {
    height: 100%;
    width: auto;
    display: block;
    filter: brightness(1) saturate(0.9) sepia(0.08);
    transition: filter 0.6s ease;
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 82%, rgba(0,0,0,0.35) 96%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 0%, #000 82%, rgba(0,0,0,0.35) 96%, transparent 100%);
  }

  .chara-slot.dim .chara-img {
    filter: brightness(0.32) saturate(0.35) sepia(0.15);
  }

  /* ==================== 顶部控制栏 ==================== */
  #top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 14px 20px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    z-index: 40;
    pointer-events: none;
  }

  #top-bar > * { pointer-events: auto; }

  /* 倍速按钮组：剧院海报式小标签 */
  .speed-group {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .speed-btn {
    background: rgba(12, 9, 6, 0.72);
    color: #c9b892;
    border: 1px solid rgba(201, 168, 92, 0.45);
    border-radius: 2px;
    padding: 6px 13px;
    font-family: "Noto Serif SC", "Songti SC", serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.25s ease;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  .speed-btn.active {
    background: rgba(201, 168, 92, 0.92);
    color: #14100a;
    border-color: rgba(201, 168, 92, 1);
    box-shadow: 0 0 12px rgba(201, 168, 92, 0.25);
  }

  .speed-btn:active {
    transform: scale(0.95);
  }

  /* 跳过按钮：带 ❖ 装饰的舞台指令 */
  #skip-btn {
    background: rgba(12, 9, 6, 0.72);
    color: #d8c9a8;
    border: 1px solid rgba(201, 168, 92, 0.5);
    border-radius: 2px;
    padding: 6px 16px;
    font-family: "Noto Serif SC", "Songti SC", serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: all 0.25s ease;
  }

  #skip-btn::before {
    content: "❖ ";
    opacity: 0.65;
  }

  #skip-btn:active {
    transform: scale(0.95);
    background: rgba(120, 40, 30, 0.8);
    border-color: rgba(180, 90, 70, 0.9);
    color: #f0dcc0;
  }

  /* ==================== 底部对话框 ==================== */
  #dialogue-box {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 0;
    width: 100%;
    max-width: 100%;
    min-height: 170px;
    max-height: 46vh;
    background:
      linear-gradient(180deg, rgba(12, 9, 6, 0) 0%, rgba(12, 9, 6, 0.94) 16%, rgba(8, 6, 4, 0.98) 100%);
    border-top: 1px solid rgba(201, 168, 92, 0.18);
    padding: 30px 40px;
    padding-bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    z-index: 20;
    cursor: pointer;
  }

  /* 对话框顶部装饰线：细金线 + 中央 ❖ */
  #dialogue-box::before {
    content: "❖";
    position: absolute;
    top: -9px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: rgba(201, 168, 92, 0.55);
    background: #0a0806;
    padding: 0 10px;
    line-height: 1;
  }

  #dialogue-box::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(201, 168, 92, 0.4) 20%, rgba(201, 168, 92, 0.55) 50%, rgba(201, 168, 92, 0.4) 80%, transparent 100%);
  }

  /* 说话人名字 */
  #speaker-name {
    font-family: "Noto Serif SC", "Songti SC", serif;
    font-size: 15px;
    font-weight: 700;
    color: #d4b46a;
    margin-bottom: 10px;
    letter-spacing: 3px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    min-height: 20px;
  }

  #speaker-name:not(:empty)::before {
    content: "— ";
    opacity: 0.5;
  }

  #speaker-name:not(:empty)::after {
    content: " —";
    opacity: 0.5;
  }

  /* 对话文本 */
  #dialogue-text {
    font-family: "Noto Serif SC", "Songti SC", serif;
    font-size: 17px;
    line-height: 1.8;
    color: #e8ddc8;
    text-shadow: 0 1px 8px rgba(0,0,0,0.95);
    word-break: break-word;
    min-height: 1.8em;
    letter-spacing: 0.5px;
  }

  /* 打字机光标 */
  .cursor {
    display: inline-block;
    width: 1.5px;
    height: 1.1em;
    background: #d4b46a;
    margin-left: 3px;
    vertical-align: text-bottom;
    animation: blink 0.9s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* 点击继续提示 */
  #continue-hint {
    position: absolute;
    bottom: 10px;
    right: 40px;
    font-size: 11px;
    color: rgba(201, 168, 92, 0.45);
    letter-spacing: 1px;
    animation: float 2s ease-in-out infinite;
    display: none;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); opacity: 0.45; }
    50% { transform: translateY(-3px); opacity: 0.85; }
  }

  /* ==================== 跳过弹窗 ==================== */
  #skip-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(6, 5, 3, 0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 28px;
  }

  #skip-modal-overlay.show { display: flex; }

  #skip-modal {
    position: relative;
    background: linear-gradient(170deg, #18120a 0%, #0e0a06 100%);
    border: 1px solid rgba(201, 168, 92, 0.35);
    border-radius: 3px;
    padding: 34px 32px 28px;
    max-width: 560px;
    width: 100%;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.85), inset 0 0 60px rgba(201, 168, 92, 0.03);
    animation: modalIn 0.35s ease-out;
    cursor: pointer;
  }

  /* 弹窗四角 ❖ 装饰 */
  #skip-modal::before,
  #skip-modal::after {
    content: "❖";
    position: absolute;
    font-size: 10px;
    color: rgba(201, 168, 92, 0.4);
  }

  #skip-modal::before { top: 10px; left: 14px; }
  #skip-modal::after  { bottom: 10px; right: 14px; }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.94) translateY(14px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  #skip-modal h3 {
    font-family: "Noto Serif SC", "Songti SC", serif;
    font-size: 15px;
    color: #d4b46a;
    margin-bottom: 18px;
    font-weight: 700;
    letter-spacing: 4px;
    text-align: center;
  }

  #skip-modal h3::before {
    content: "— ";
    opacity: 0.5;
  }

  #skip-modal h3::after {
    content: " —";
    opacity: 0.5;
  }

  #skip-modal p {
    font-family: "Noto Serif SC", "Songti SC", serif;
    font-size: 15px;
    line-height: 1.85;
    color: #c4b89e;
    margin-bottom: 22px;
    letter-spacing: 0.5px;
    text-align: justify;
  }

  #skip-modal .modal-hint {
    font-size: 11px;
    color: rgba(201, 168, 92, 0.35);
    text-align: center;
    margin-bottom: 0;
    letter-spacing: 2px;
    animation: float 2s ease-in-out infinite;
  }

  /* ==================== 竖屏提示 ==================== */
  #rotate-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #0a0806;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    color: #d4b46a;
    text-align: center;
    padding: 24px;
    font-family: "Noto Serif SC", "Songti SC", serif;
  }

  #rotate-overlay .rotate-icon {
    font-size: 50px;
    margin-bottom: 22px;
    animation: rotateHint 2.2s ease-in-out infinite;
    opacity: 0.85;
  }

  @keyframes rotateHint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }

  #rotate-overlay p {
    font-size: 15px;
    color: #a89878;
    line-height: 1.8;
    letter-spacing: 2px;
  }

  @media (orientation: portrait) {
    #rotate-overlay { display: flex; }
    #game { visibility: hidden; }
  }
</style>
</head>
<body>

<div id="rotate-overlay">
  <div class="rotate-icon">❖</div>
  <p>请将手机横屏使用<br>以获得最佳游戏体验</p>
</div>

<div id="game">
  <div id="bg-layer"></div>
  <div id="bg-vignette"></div>

  <div id="chara-layer">
    <div class="chara-slot" id="chara-left">
      <img class="chara-img" alt="chrt01">
    </div>
    <div class="chara-slot" id="chara-right">
      <img class="chara-img" alt="chrt02">
    </div>
  </div>

  <div id="top-bar">
    <div class="speed-group">
      <button class="speed-btn active" data-speed="1">NO</button>
      <button class="speed-btn" data-speed="2">x2</button>
      <button class="speed-btn" data-speed="3">x3</button>
      <button class="speed-btn" data-speed="4">x4</button>
    </div>
    <button id="skip-btn">跳过 ▶▶</button>
  </div>

  <div id="dialogue-box">
    <div id="speaker-name"></div>
    <div id="dialogue-text"></div>
    <div id="continue-hint">点击继续 ▼</div>
  </div>

  <div id="skip-modal-overlay">
    <div id="skip-modal">
      <h3>剧目简略</h3>
      <p id="skip-summary"></p>
      <p class="modal-hint">❖ 点击任意位置继续下一幕 ❖</p>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ==================== 配置 ====================
  const CONFIG = {
    // ⚠️ 请核对仓库名拼写：origincharacter001 / originccharacter001
    imageBase: 'https://cdn.jsdelivr.net/gh/FanyDay102/originccharacter001@main',
    audioBase: 'https://cdn.jsdelivr.net/gh/FanyDay102/originccharacter001@main',

    baseTypeSpeed: 45,
    baseAutoDelay: 4400,
    fadeDuration: 400,

    bgmVolume: 0.4,
    bgmFadeDuration: 800,
  };

  // ==================== 剧情数据 ====================
  // 幕级：bg / bgm / summary / dialogues
  // 句级：{ speaker, text, chara, bgm? }
  //   chara: 'chrt01' 左 / 'chrt02' 右 / null 旁白
  //   bgm:   不写 = 不变；'xxx.mp3' = 切换；null / '' = 停止
  const story = [
    {
      bg: 'bg001room.png',
      bgm: 'bgm001.mp3',
      summary: '你在一个陌生的房间醒来，空气中弥漫着消毒水的气味。你失去所有记忆，仅仅记得自己的名字。一位自称为你养子的少女协同3位伙伴将你从[塔]的大楼中救出，并一路逃往Ontario。',
      dialogues: [
        { speaker: '旁白', text: '你缓缓睁开眼睛，视线逐渐聚焦。', chara: null },
        { speaker: '旁白', text: '最先映入眼帘的是晃眼的白色天花板，以及置于顶端的LED白灯管。耳边是[滴滴答]作响的仪器，喉管被异物入侵的不适感随之而来。你确信你不是自主呼吸，那些冰冷的空气充满化学工业的气息。', chara: null },
        { speaker: '旁白', text: '可无论如何，你什么都做不了，哪怕只是晃动眼球都撕扯地眼部剧痛......', chara: 'chrt01' },
        { speaker: '你', text: '（......这是哪里？）', chara: 'chrt01' },
        { speaker: '你', text: '（我记得我明明在家里……怎么会到这里？）', chara: 'chrt01' },
        { speaker: '旁白', text: '你试图回忆，但脑海中只有一片模糊的碎片。', chara: null },
        { speaker: '旁白', text: '桌上放着一张泛黄的纸条，上面用红笔写着一行字。', chara: null },
        { speaker: '你', text: '"牺牲一个人，可以拯救许多人。你，会怎么选？"', chara: 'chrt01' },
        { speaker: '旁白', text: '你握紧了纸条，心跳开始加速。', chara: null },
      ]
    },
    {
      bg: 'bg001room.png',
      bgm: 'bgm002.mp3',
      summary: '门突然打开，一个陌生人出现在门口。他告诉你，外面爆发了灾难，而你手中握有唯一的解药配方。你必须决定是否交出配方。',
      dialogues: [
        { speaker: '旁白', text: '就在你沉思之际，门锁发出了"咔哒"一声。', chara: null },
        { speaker: '陌生人', text: '你醒了。', chara: 'chrt02', bgm: 'bgm003.mp3' },
        { speaker: '陌生人', text: '听着，我没时间解释太多。外面的世界已经乱了，病毒在蔓延。', chara: 'chrt02' },
        { speaker: '陌生人', text: '而你——你的血液里，有唯一的抗体。', chara: 'chrt02' },
        { speaker: '你', text: '……你在说什么？', chara: 'chrt01' },
        { speaker: '陌生人', text: '我需要你的配合。跟我走，或者留在这里等死。', chara: 'chrt02' },
        { speaker: '旁白', text: '他伸出了手，眼神里既有焦急，也有一丝你看不透的东西。', chara: null, bgm: null },
      ]
    },
  ];

  // ==================== 状态 ====================
  let sceneIndex = 0;
  let dialogueIndex = 0;
  let speed = 1;
  let isTyping = false;
  let typeTimer = null;
  let autoTimer = null;
  let fullText = '';
  let displayedText = '';
  let charIndex = 0;
  let isTransitioning = false;
  let skipModalVisible = false;
  let hasStarted = false;

  // ==================== DOM ====================
  const $game = document.getElementById('game');
  const $bgLayer = document.getElementById('bg-layer');
  const $speakerName = document.getElementById('speaker-name');
  const $dialogueText = document.getElementById('dialogue-text');
  const $continueHint = document.getElementById('continue-hint');
  const $skipBtn = document.getElementById('skip-btn');
  const $skipModalOverlay = document.getElementById('skip-modal-overlay');
  const $skipSummary = document.getElementById('skip-summary');
  const $speedBtns = document.querySelectorAll('.speed-btn');
  const $charaLeft = document.getElementById('chara-left');
  const $charaRight = document.getElementById('chara-right');

  // ==================== 工具 ====================
  function getBgUrl(filename) { return CONFIG.imageBase + '/' + filename; }
  function getCharaUrl(name) { return CONFIG.imageBase + '/' + name + '.png'; }
  function getAudioUrl(filename) { return CONFIG.audioBase + '/' + filename; }

  function setBackground(filename) {
    const url = getBgUrl(filename);
    const img = new Image();
    img.onload = function() {
      $bgLayer.style.backgroundImage = 'url("' + url + '")';
      $bgLayer.classList.remove('fallback');
    };
    img.onerror = function() {
      console.warn('背景图片加载失败:', url);
      $bgLayer.classList.add('fallback');
      $bgLayer.style.backgroundImage = 'none';
    };
    img.src = url;
  }

  function clearTypingTimer() {
    if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
    isTyping = false;
  }

  function clearAutoTimer() {
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  }

  function getTypeSpeed() { return CONFIG.baseTypeSpeed / speed; }
  function getAutoDelay() { return CONFIG.baseAutoDelay / speed; }

  // ==================== BGM ====================
  let currentBgm = null;
  let pendingBgmName = '';
  let bgmUnlocked = false;

  function fadeAudio(audio, fromVol, toVol, duration, onDone) {
    if (!audio) { if (onDone) onDone(); return; }
    const steps = Math.max(1, Math.round(duration / 50));
    const stepTime = duration / steps;
    const delta = (toVol - fromVol) / steps;
    let step = 0;
    audio.volume = fromVol;
    const timer = setInterval(function() {
      step++;
      let v = fromVol + delta * step;
      if (v < 0) v = 0;
      if (v > 1) v = 1;
      audio.volume = v;
      if (step >= steps) {
        clearInterval(timer);
        audio.volume = toVol;
        if (onDone) onDone();
      }
    }, stepTime);
  }

  function switchBgm(filename, fadeDuration) {
    const fade = (typeof fadeDuration === 'number') ? fadeDuration : CONFIG.bgmFadeDuration;
    const target = filename || '';

    if (!bgmUnlocked) { pendingBgmName = target; return; }
    if (currentBgm && currentBgm.name === target) return;
    if (!currentBgm && !target) return;

    if (currentBgm) {
      const oldAudio = currentBgm.audio;
      currentBgm = null;
      fadeAudio(oldAudio, oldAudio.volume, 0, fade, function() {
        try { oldAudio.pause(); oldAudio.src = ''; } catch (e) {}
      });
    }

    if (!target) return;

    const audio = new Audio();
    audio.loop = true;
    audio.preload = 'auto';
    audio.src = getAudioUrl(target);
    audio.volume = 0;

    currentBgm = { audio: audio, name: target };

    const playPromise = audio.play();
    if (playPromise && typeof playPromise.then === 'function') {
      playPromise.then(function() {
        fadeAudio(audio, 0, CONFIG.bgmVolume, fade);
      }).catch(function(err) {
        console.warn('BGM 播放失败（可能被浏览器拦截）:', err);
      });
    } else {
      fadeAudio(audio, 0, CONFIG.bgmVolume, fade);
    }
  }

  function unlockBgm() {
    if (bgmUnlocked) return;
    bgmUnlocked = true;
    const name = pendingBgmName;
    pendingBgmName = '';
    if (name) switchBgm(name);
  }

  // ==================== 角色 ====================
  function applyChara(charaName) {
    const leftLit  = charaName === 'chrt01';
    const rightLit = charaName === 'chrt02';

    if (leftLit) {
      ensureCharaShown($charaLeft, 'chrt01');
      $charaLeft.classList.remove('dim');
    } else if ($charaLeft.classList.contains('visible')) {
      $charaLeft.classList.add('dim');
    }

    if (rightLit) {
      ensureCharaShown($charaRight, 'chrt02');
      $charaRight.classList.remove('dim');
    } else if ($charaRight.classList.contains('visible')) {
      $charaRight.classList.add('dim');
    }
  }

  function ensureCharaShown(slot, name) {
    const img = slot.querySelector('.chara-img');
    if (img.getAttribute('data-chara') !== name) {
      img.src = getCharaUrl(name);
      img.setAttribute('data-chara', name);
    }
    slot.classList.add('visible');
  }

  function resetCharacters() {
    [$charaLeft, $charaRight].forEach(function(slot) {
      slot.classList.remove('visible', 'dim');
      const img = slot.querySelector('.chara-img');
      img.removeAttribute('src');
      img.removeAttribute('data-chara');
    });
  }

  function preloadCharas() {
    ['chrt01', 'chrt02'].forEach(function(name) {
      const img = new Image();
      img.src = getCharaUrl(name);
    });
  }

  // ==================== 打字机 ====================
  function startDialogue() {
    clearTypingTimer();
    clearAutoTimer();

    const scene = story[sceneIndex];
    if (!scene) return;

    const dialogue = scene.dialogues[dialogueIndex];
    if (!dialogue) { nextScene(); return; }

    if (Object.prototype.hasOwnProperty.call(dialogue, 'bgm')) {
      switchBgm(dialogue.bgm);
    }

    $speakerName.textContent = dialogue.speaker || '';
    applyChara(dialogue.chara || null);

    fullText = dialogue.text || '……';
    displayedText = '';
    charIndex = 0;
    $dialogueText.innerHTML = '';
    $continueHint.style.display = 'none';

    isTyping = true;
    const speedMs = getTypeSpeed();

    typeTimer = setInterval(function() {
      if (charIndex < fullText.length) {
        displayedText += fullText.charAt(charIndex);
        charIndex++;
        $dialogueText.textContent = displayedText;
      } else {
        clearTypingTimer();
        $dialogueText.innerHTML = displayedText + '<span class="cursor"></span>';
        $continueHint.style.display = 'block';
        scheduleAutoAdvance();
      }
    }, Math.max(speedMs, 8));
  }

  function completeTyping() {
    if (!isTyping) return;
    clearTypingTimer();
    displayedText = fullText;
    charIndex = fullText.length;
    $dialogueText.innerHTML = displayedText + '<span class="cursor"></span>';
    $continueHint.style.display = 'block';
    scheduleAutoAdvance();
  }

  function scheduleAutoAdvance() {
    clearAutoTimer();
    if (speed < 2) return;
    if (skipModalVisible) return;
    if (isTransitioning) return;

    autoTimer = setTimeout(function() {
      autoTimer = null;
      handleDialogueClick();
    }, getAutoDelay());
  }

  function restartTyping() {
    clearTypingTimer();
    const remainingText = fullText.substring(charIndex);
    let remainingIndex = 0;
    isTyping = true;
    const speedMs = getTypeSpeed();

    typeTimer = setInterval(function() {
      if (remainingIndex < remainingText.length) {
        displayedText += remainingText.charAt(remainingIndex);
        remainingIndex++;
        charIndex++;
        $dialogueText.textContent = displayedText;
      } else {
        clearTypingTimer();
        $dialogueText.innerHTML = displayedText + '<span class="cursor"></span>';
        $continueHint.style.display = 'block';
        scheduleAutoAdvance();
      }
    }, Math.max(speedMs, 8));
  }

  // ==================== 推进 ====================
  function handleDialogueClick() {
    if (skipModalVisible) return;
    if (isTransitioning) return;

    clearAutoTimer();

    if (!hasStarted) {
      hasStarted = true;
      tryLockLandscape();
    }

    if (isTyping) { completeTyping(); return; }

    const scene = story[sceneIndex];
    if (!scene) return;

    if (dialogueIndex < scene.dialogues.length - 1) {
      dialogueIndex++;
      startDialogue();
    } else {
      nextScene();
    }
  }

  // ==================== 场景切换 ====================
  function nextScene() {
    if (isTransitioning) return;

    clearAutoTimer();
    clearTypingTimer();
    sceneIndex++;

    if (sceneIndex >= story.length) {
      $speakerName.textContent = '';
      $dialogueText.innerHTML = '— 全剧终 —';
      $continueHint.style.display = 'none';
      $skipBtn.disabled = true;
      $skipBtn.style.opacity = '0.35';
      switchBgm('');
      return;
    }

    isTransitioning = true;
    $bgLayer.style.opacity = '0';

    setTimeout(function() {
      const newScene = story[sceneIndex];
      setBackground(newScene.bg);
      resetCharacters();
      dialogueIndex = 0;
      switchBgm(newScene.bgm || '');

      $speakerName.textContent = '';
      $dialogueText.innerHTML = '';
      $continueHint.style.display = 'none';
      $bgLayer.style.opacity = '1';

      setTimeout(function() {
        isTransitioning = false;
        startDialogue();
      }, CONFIG.fadeDuration);
    }, CONFIG.fadeDuration);
  }

  // ==================== 跳过 ====================
  function showSkipModal() {
    if (isTransitioning) return;
    if (skipModalVisible) return;

    const scene = story[sceneIndex];
    if (!scene) return;

    $skipSummary.textContent = scene.summary || '（暂无简略剧情）';
    $skipModalOverlay.classList.add('show');
    skipModalVisible = true;
    clearTypingTimer();
    clearAutoTimer();
  }

  function hideSkipModalAndAdvance() {
    if (!skipModalVisible) return;
    $skipModalOverlay.classList.remove('show');
    skipModalVisible = false;
    nextScene();
  }

  // ==================== 倍速 ====================
  function setSpeed(newSpeed) {
    speed = newSpeed;
    $speedBtns.forEach(function(btn) {
      btn.classList.toggle('active', parseInt(btn.dataset.speed, 10) === newSpeed);
    });

    if (isTyping) { restartTyping(); return; }

    if (speed < 2) {
      clearAutoTimer();
    } else {
      if ($continueHint.style.display === 'block') scheduleAutoAdvance();
    }
  }

  // ==================== 横屏锁定 ====================
  function tryLockLandscape() {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(function(err) {
        console.log('屏幕方向锁定失败（可忽略）:', err.message);
      });
    }
  }

  // ==================== 初始化 ====================
  function init() {
    preloadCharas();
    if (story.length > 0) {
      setBackground(story[0].bg);
      switchBgm(story[0].bgm || '');
    }
    setSpeed(1);
    dialogueIndex = 0;
    startDialogue();
  }

  // ==================== 事件 ====================
  $game.addEventListener('click', function(e) {
    if (e.target.closest('#top-bar')) return;
    if (e.target.closest('#skip-modal-overlay')) return;
    handleDialogueClick();
  });

  $skipBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    showSkipModal();
  });

  $skipModalOverlay.addEventListener('click', function(e) {
    e.stopPropagation();
    hideSkipModalAndAdvance();
  });

  $speedBtns.forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      setSpeed(parseInt(btn.dataset.speed, 10));
    });
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      handleDialogueClick();
    }
  });

  document.addEventListener('touchmove', function(e) {
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('pointerdown', unlockBgm, { once: true, passive: true });
  document.addEventListener('keydown', unlockBgm, { once: true });

  init();
})();
</script>
</body>
</html>
