<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>剧情游戏</title>

<!-- ============ 字体引入（新增） ============ -->
<!-- MedievalSharp：中世纪哥特显示体，用于说话者名字 / 英文装饰 -->
<!-- UnifrakturMaguntia：经典哥特黑体，用于英文标题 -->
<!-- Cinzel：古典罗马衬线，用于数字和按钮，气质更稳 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=UnifrakturMaguntia&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">

<style>
  /* ---------- 全局重置 ---------- */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    /* 全局默认用楷体栈，中文有手写文艺感，英文回落到系统 sans */
    font-family: 'STKaiti', 'KaiTi', 'Kaiti SC', '楷体',
                 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    touch-action: manipulation;
    user-select: none;
  }

  /* ---------- 游戏主容器 ---------- */
  #game {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0a0a0a;
  }

  /* ---------- 背景层 ---------- */
  #bg-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: opacity 0.4s ease;
    z-index: 0;
  }

  #bg-layer.fallback {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  }

  /* ---------- 角色立绘层 ---------- */
  #chara-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 10;
  }

  .chara-slot {
    position: absolute;
    bottom: 0;
    height: 90%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    will-change: opacity;
  }

  #chara-left  { left: 0; }
  #chara-right { right: 0; }

  .chara-slot.visible { opacity: 1; }

  .chara-img {
    height: 100%;
    width: auto;
    display: block;
    filter: brightness(1) saturate(1);
    transition: filter 0.4s ease;
  }

  .chara-slot.dim .chara-img {
    filter: brightness(0.42) saturate(0.6);
  }

  /* ---------- 顶部控制栏 ---------- */
  #top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    z-index: 30;
    pointer-events: none;
  }

  #top-bar > * {
    pointer-events: auto;
  }

  .speed-group {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .speed-btn {
    background: rgba(0, 0, 0, 0.55);
    color: #ccc;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    /* 数字用 Cinzel，更古典；NO 也会走这个字体 */
    font-family: 'Cinzel', 'STKaiti', 'KaiTi', '楷体', serif;
    letter-spacing: 0.5px;
  }

  .speed-btn.active {
    background: rgba(255, 200, 50, 0.85);
    color: #111;
    border-color: rgba(255, 200, 50, 1);
  }

  .speed-btn:active {
    transform: scale(0.94);
  }

  #skip-btn {
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 8px;
    padding: 6px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: all 0.2s ease;
    font-family: 'STKaiti', 'KaiTi', 'Kaiti SC', '楷体', serif;
    letter-spacing: 1px;
  }

  #skip-btn:active {
    transform: scale(0.94);
    background: rgba(255, 80, 80, 0.7);
    border-color: rgba(255, 80, 80, 0.9);
  }

  /* ---------- 底部对话框 ---------- */
  #dialogue-box {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    min-height: 160px;
    max-height: 42vh;
    background: linear-gradient(180deg, rgba(10, 10, 20, 0.0) 0%, rgba(10, 10, 20, 0.92) 18%, rgba(8, 8, 16, 0.97) 100%);
    padding: 28px 24px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    z-index: 20;
    cursor: pointer;
  }

  /* 说话者名字：哥特体优先（英文名会显示为哥特体），中文名回落到楷体 */
  #speaker-name {
    font-family: 'MedievalSharp', 'STKaiti', 'KaiTi', 'Kaiti SC', '楷体', serif;
    font-size: 17px;
    font-weight: 700;
    color: #ffd764;
    margin-bottom: 8px;
    letter-spacing: 1px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6), 0 0 12px rgba(255, 215, 100, 0.15);
    min-height: 22px;
  }

  /* 对话正文：楷体，有手写文艺感；字号略放大以保可读性 */
  #dialogue-text {
    font-family: 'STKaiti', 'KaiTi', 'Kaiti SC', '楷体',
                 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    font-size: 18px;
    line-height: 1.75;
    color: #f0f0f0;
    text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    word-break: break-word;
    letter-spacing: 0.4px;
    min-height: 1.75em;
  }

  /* 「全剧终」专用样式：行楷 + 金色 + 宽字距，有仪式感 */
  .ending-text {
    display: inline-block;
    font-family: 'STXingkai', 'Xingkai SC', '华文行楷', 'STKaiti', 'KaiTi', '楷体', serif;
    font-size: 26px;
    color: #ffd764;
    letter-spacing: 8px;
    text-shadow: 0 0 18px rgba(255, 215, 100, 0.45), 0 2px 8px rgba(0, 0, 0, 0.8);
    padding: 4px 0;
  }

  /* 打字机光标 */
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1.1em;
    background: #ffd764;
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.8s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* 点击继续提示 */
  #continue-hint {
    position: absolute;
    bottom: 12px;
    right: 20px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.55);
    animation: float 1.6s ease-in-out infinite;
    display: none;
    font-family: 'STKaiti', 'KaiTi', '楷体', serif;
    letter-spacing: 1px;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); opacity: 0.55; }
    50% { transform: translateY(-4px); opacity: 1; }
  }

  /* ---------- 跳过弹窗 ---------- */
  #skip-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }

  #skip-modal-overlay.show {
    display: flex;
  }

  #skip-modal {
    background: linear-gradient(160deg, #1e1e2e 0%, #14141f 100%);
    border: 1px solid rgba(255, 215, 100, 0.25);
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    animation: modalIn 0.28s ease-out;
    cursor: pointer;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.92) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* 弹窗标题：楷体加粗，金色，字距拉开 */
  #skip-modal h3 {
    font-family: 'STKaiti', 'KaiTi', 'Kaiti SC', '楷体', serif;
    font-size: 18px;
    color: #ffd764;
    margin-bottom: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-align: center;
  }

  /* 弹窗正文：楷体，行距放宽 */
  #skip-modal p {
    font-family: 'STKaiti', 'KaiTi', 'Kaiti SC', '楷体', serif;
    font-size: 16px;
    line-height: 1.85;
    color: #d0d0d8;
    margin-bottom: 18px;
    letter-spacing: 0.3px;
  }

  #skip-modal .modal-hint {
    font-family: 'STKaiti', 'KaiTi', '楷体', serif;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.4);
    text-align: center;
    margin-bottom: 0;
    letter-spacing: 1px;
    animation: float 1.6s ease-in-out infinite;
  }

  /* ---------- 竖屏提示覆盖层 ---------- */
  #rotate-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #0a0a12;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    color: #fff;
    text-align: center;
    padding: 24px;
  }

  #rotate-overlay .rotate-icon {
    font-size: 56px;
    margin-bottom: 20px;
    animation: rotateHint 2s ease-in-out infinite;
  }

  @keyframes rotateHint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }

  #rotate-overlay p {
    font-family: 'STKaiti', 'KaiTi', '楷体', serif;
    font-size: 16px;
    color: #aaa;
    line-height: 1.6;
    letter-spacing: 1px;
  }

  @media (orientation: portrait) {
    #rotate-overlay {
      display: flex;
    }
    #game {
      visibility: hidden;
    }
  }
</style>
</head>
<body>

<!-- 竖屏提示 -->
<div id="rotate-overlay">
  <div class="rotate-icon">📱</div>
  <p>请将手机横屏使用<br>以获得最佳游戏体验</p>
</div>

<!-- 游戏主容器 -->
<div id="game">
  <div id="bg-layer"></div>

  <!-- 角色立绘层 -->
  <div id="chara-layer">
    <div class="chara-slot" id="chara-left">
      <img class="chara-img" alt="chrt01">
    </div>
    <div class="chara-slot" id="chara-right">
      <img class="chara-img" alt="chrt02">
    </div>
  </div>

  <!-- 顶部控制栏 -->
  <div id="top-bar">
    <div class="speed-group">
      <button class="speed-btn active" data-speed="1">NO</button>
      <button class="speed-btn" data-speed="2">x2</button>
      <button class="speed-btn" data-speed="3">x3</button>
      <button class="speed-btn" data-speed="4">x4</button>
    </div>
    <button id="skip-btn">跳过 ▶▶</button>
  </div>

  <!-- 底部对话框 -->
  <div id="dialogue-box">
    <div id="speaker-name"></div>
    <div id="dialogue-text"></div>
    <div id="continue-hint">点击继续 ▼</div>
  </div>

  <!-- 跳过弹窗 -->
  <div id="skip-modal-overlay">
    <div id="skip-modal">
      <h3>📖 剧情简略</h3>
      <p id="skip-summary"></p>
      <p class="modal-hint">点击任意位置继续下一幕</p>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  const CONFIG = {
    imageBase: 'https://cdn.jsdelivr.net/gh/FanyDay102/originccharacter001@main',
    audioBase: 'https://cdn.jsdelivr.net/gh/FanyDay102/originccharacter001@main',
    baseTypeSpeed: 45,
    baseAutoDelay: 4400,
    fadeDuration: 400,
    bgmVolume: 0.4,
    bgmFadeDuration: 800,
  };

  const story = [
    {
      bg: 'bg001room.png',
      bgm: 'bgm001.mp3',
      summary: '你在一个陌生的房间醒来，空气中弥漫着消毒水的气味。你失去所有记忆，仅仅记得自己的名字。一位自称为你养子的少女协同3位伙伴将你从[塔]的大楼中救出，并一路逃往Ontario。',
      dialogues: [
        { speaker: '旁白', text: '你缓缓睁开眼睛，视线逐渐聚焦。', chara: null },
        { speaker: '旁白', text: '最先映入眼帘的是晃眼的白色天花板，以及置于顶端的LED白灯管。耳边是[滴滴答]作响的仪器，喉管被异物入侵的不适感随之而来。你确信你不是自主呼吸，那些冰冷的空气充满化学工业的气息。', chara: null },
        { speaker: '旁白', text: '可无论如何，你什么都做不了，哪怕只是晃动眼球都撕扯地眼部剧痛......', chara: 'chrt01' },
        { speaker: '你', text: '（......这是哪里？）', chara: 'chrt01' },
        { speaker: '你', text: '（我记得我明明在家里……怎么会到这里？）', chara: 'chrt01' },
        { speaker: '旁白', text: '你试图回忆，但脑海中只有一片模糊的碎片。', chara: null },
        { speaker: '旁白', text: '桌上放着一张泛黄的纸条，上面用红笔写着一行字。', chara: null },
        { speaker: '你', text: '"牺牲一个人，可以拯救许多人。你，会怎么选？"', chara: 'chrt01' },
        { speaker: '旁白', text: '你握紧了纸条，心跳开始加速。', chara: null },
      ]
    },
    {
      bg: 'bg001room.png',
      bgm: 'bgm002.mp3',
      summary: '门突然打开，一个陌生人出现在门口。他告诉你，外面爆发了灾难，而你手中握有唯一的解药配方。你必须决定是否交出配方。',
      dialogues: [
        { speaker: '旁白', text: '就在你沉思之际，门锁发出了"咔哒"一声。', chara: null },
        { speaker: '陌生人', text: '你醒了。', chara: 'chrt02', bgm: 'bgm003.mp3' },
        { speaker: '陌生人', text: '听着，我没时间解释太多。外面的世界已经乱了，病毒在蔓延。', chara: 'chrt02' },
        { speaker: '陌生人', text: '而你——你的血液里，有唯一的抗体。', chara: 'chrt02' },
        { speaker: '你', text: '……你在说什么？', chara: 'chrt01' },
        { speaker: '陌生人', text: '我需要你的配合。跟我走，或者留在这里等死。', chara: 'chrt02' },
        { speaker: '旁白', text: '他伸出了手，眼神里既有焦急，也有一丝你看不透的东西。', chara: null, bgm: null },
      ]
    },
  ];

  let sceneIndex = 0;
  let dialogueIndex = 0;
  let speed = 1;
  let isTyping = false;
  let typeTimer = null;
  let autoTimer = null;
  let fullText = '';
  let displayedText = '';
  let charIndex = 0;
  let isTransitioning = false;
  let skipModalVisible = false;
  let hasStarted = false;

  const $game = document.getElementById('game');
  const $bgLayer = document.getElementById('bg-layer');
  const $speakerName = document.getElementById('speaker-name');
  const $dialogueText = document.getElementById('dialogue-text');
  const $dialogueBox = document.getElementById('dialogue-box');
  const $continueHint = document.getElementById('continue-hint');
  const $skipBtn = document.getElementById('skip-btn');
  const $skipModalOverlay = document.getElementById('skip-modal-overlay');
  const $skipSummary = document.getElementById('skip-summary');
  const $speedBtns = document.querySelectorAll('.speed-btn');
  const $charaLeft = document.getElementById('chara-left');
  const $charaRight = document.getElementById('chara-right');

  function getBgUrl(filename) { return CONFIG.imageBase + '/' + filename; }
  function getCharaUrl(name) { return CONFIG.imageBase + '/' + name + '.png'; }
  function getAudioUrl(filename) { return CONFIG.audioBase + '/' + filename; }

  function setBackground(filename) {
    const url = getBgUrl(filename);
    const img = new Image();
    img.onload = function() {
      $bgLayer.style.backgroundImage = 'url("' + url + '")';
      $bgLayer.classList.remove('fallback');
    };
    img.onerror = function() {
      console.warn('背景图片加载失败:', url);
      $bgLayer.classList.add('fallback');
      $bgLayer.style.backgroundImage = 'none';
    };
    img.src = url;
  }

  function clearTypingTimer() {
    if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
    isTyping = false;
  }

  function clearAutoTimer() {
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  }

  function getTypeSpeed() { return CONFIG.baseTypeSpeed / speed; }
  function getAutoDelay() { return CONFIG.baseAutoDelay / speed; }

  // ---------- BGM ----------
  let currentBgm = null;
  let pendingBgmName = '';
  let bgmUnlocked = false;

  function fadeAudio(audio, fromVol, toVol, duration, onDone) {
    if (!audio) { if (onDone) onDone(); return; }
    const steps = Math.max(1, Math.round(duration / 50));
    const stepTime = duration / steps;
    const delta = (toVol - fromVol) / steps;
    let step = 0;
    audio.volume = fromVol;
    const timer = setInterval(function() {
      step++;
      let v = fromVol + delta * step;
      if (v < 0) v = 0;
      if (v > 1) v = 1;
      audio.volume = v;
      if (step >= steps) {
        clearInterval(timer);
        audio.volume = toVol;
        if (onDone) onDone();
      }
    }, stepTime);
  }

  function switchBgm(filename, fadeDuration) {
    const fade = (typeof fadeDuration === 'number') ? fadeDuration : CONFIG.bgmFadeDuration;
    const target = filename || '';
    if (!bgmUnlocked) { pendingBgmName = target; return; }
    if (currentBgm && currentBgm.name === target) return;
    if (!currentBgm && !target) return;

    if (currentBgm) {
      const oldAudio = currentBgm.audio;
      currentBgm = null;
      fadeAudio(oldAudio, oldAudio.volume, 0, fade, function() {
        try { oldAudio.pause(); oldAudio.src = ''; } catch (e) {}
      });
    }

    if (!target) return;

    const audio = new Audio();
    audio.loop = true;
    audio.preload = 'auto';
    audio.src = getAudioUrl(target);
    audio.volume = 0;
    currentBgm = { audio: audio, name: target };

    const playPromise = audio.play();
    if (playPromise && typeof playPromise.then === 'function') {
      playPromise.then(function() {
        fadeAudio(audio, 0, CONFIG.bgmVolume, fade);
      }).catch(function(err) {
        console.warn('BGM 播放失败（可能被浏览器拦截）:', err);
      });
    } else {
      fadeAudio(audio, 0, CONFIG.bgmVolume, fade);
    }
  }

  function unlockBgm() {
    if (bgmUnlocked) return;
    bgmUnlocked = true;
    const name = pendingBgmName;
    pendingBgmName = '';
    if (name) switchBgm(name);
  }

  // ---------- 角色立绘 ----------
  function applyChara(charaName) {
    const leftLit  = charaName === 'chrt01';
    const rightLit = charaName === 'chrt02';

    if (leftLit) {
      ensureCharaShown($charaLeft, 'chrt01');
      $charaLeft.classList.remove('dim');
    } else if ($charaLeft.classList.contains('visible')) {
      $charaLeft.classList.add('dim');
    }

    if (rightLit) {
      ensureCharaShown($charaRight, 'chrt02');
      $charaRight.classList.remove('dim');
    } else if ($charaRight.classList.contains('visible')) {
      $charaRight.classList.add('dim');
    }
  }

  function ensureCharaShown(slot, name) {
    const img = slot.querySelector('.chara-img');
    if (img.getAttribute('data-chara') !== name) {
      img.src = getCharaUrl(name);
      img.setAttribute('data-chara', name);
    }
    slot.classList.add('visible');
  }

  function resetCharacters() {
    [$charaLeft, $charaRight].forEach(function(slot) {
      slot.classList.remove('visible', 'dim');
      const img = slot.querySelector('.chara-img');
      img.removeAttribute('src');
      img.removeAttribute('data-chara');
    });
  }

  function preloadCharas() {
    ['chrt01', 'chrt02'].forEach(function(name) {
      const img = new Image();
      img.src = getCharaUrl(name);
    });
  }

  // ---------- 打字机 ----------
  function startDialogue() {
    clearTypingTimer();
    clearAutoTimer();

    const scene = story[sceneIndex];
    if (!scene) return;

    const dialogue = scene.dialogues[dialogueIndex];
    if (!dialogue) { nextScene(); return; }

    if (Object.prototype.hasOwnProperty.call(dialogue, 'bgm')) {
      switchBgm(dialogue.bgm);
    }

    $speakerName.textContent = dialogue.speaker || '';
    applyChara(dialogue.chara || null);

    fullText = dialogue.text || '……';
    displayedText = '';
    charIndex = 0;
    $dialogueText.innerHTML = '';
    $continueHint.style.display = 'none';

    isTyping = true;
    const speedMs = getTypeSpeed();
    typeTimer = setInterval(function() {
      if (charIndex < fullText.length) {
        displayedText += fullText.charAt(charIndex);
        charIndex++;
        $dialogueText.textContent = displayedText;
      } else {
        clearTypingTimer();
        isTyping = false;
        $dialogueText.innerHTML = displayedText + '<span class="cursor"></span>';
        $continueHint.style.display = 'block';
        scheduleAutoAdvance();
      }
    }, Math.max(speedMs, 8));
  }

  function completeTyping() {
    if (!isTyping) return;
    clearTypingTimer();
    displayedText = fullText;
    charIndex = fullText.length;
    $dialogueText.innerHTML = displayedText + '<span class="cursor"></span>';
    isTyping = false;
    $continueHint.style.display = 'block';
    scheduleAutoAdvance();
  }

  function scheduleAutoAdvance() {
    clearAutoTimer();
    if (speed < 2) return;
    if (skipModalVisible) return;
    if (isTransitioning) return;
    autoTimer = setTimeout(function() {
      autoTimer = null;
      handleDialogueClick();
    }, getAutoDelay());
  }

  function restartTyping() {
    clearTypingTimer();
    const remainingText = fullText.substring(charIndex);
    let remainingIndex = 0;
    isTyping = true;
    const speedMs = getTypeSpeed();
    typeTimer = setInterval(function() {
      if (remainingIndex < remainingText.length) {
        displayedText += remainingText.charAt(remainingIndex);
        remainingIndex++;
        charIndex++;
        $dialogueText.textContent = displayedText;
      } else {
        clearTypingTimer();
        isTyping = false;
        $dialogueText.innerHTML = displayedText + '<span class="cursor"></span>';
        $continueHint.style.display = 'block';
        scheduleAutoAdvance();
      }
    }, Math.max(speedMs, 8));
  }

  // ---------- 推进 ----------
  function handleDialogueClick() {
    if (skipModalVisible) return;
    if (isTransitioning) return;
    clearAutoTimer();

    if (!hasStarted) {
      hasStarted = true;
      tryLockLandscape();
    }

    if (isTyping) { completeTyping(); return; }

    const scene = story[sceneIndex];
    if (!scene) return;

    if (dialogueIndex < scene.dialogues.length - 1) {
      dialogueIndex++;
      startDialogue();
    } else {
      nextScene();
    }
  }

  // ---------- 场景切换 ----------
  function nextScene() {
    if (isTransitioning) return;
    clearAutoTimer();
    clearTypingTimer();
    sceneIndex++;

    if (sceneIndex >= story.length) {
      $speakerName.textContent = '';
      // 给「全剧终」套一个可独立样式的 span
      $dialogueText.innerHTML = '<span class="ending-text">— 全 剧 终 —</span>';
      $continueHint.style.display = 'none';
      $skipBtn.disabled = true;
      $skipBtn.style.opacity = '0.4';
      switchBgm('');
      return;
    }

    isTransitioning = true;
    $bgLayer.style.opacity = '0';

    setTimeout(function() {
      const newScene = story[sceneIndex];
      setBackground(newScene.bg);
      resetCharacters();
      dialogueIndex = 0;
      switchBgm(newScene.bgm || '');
      $speakerName.textContent = '';
      $dialogueText.innerHTML = '';
      $continueHint.style.display = 'none';
      $bgLayer.style.opacity = '1';
      setTimeout(function() {
        isTransitioning = false;
        startDialogue();
      }, CONFIG.fadeDuration);
    }, CONFIG.fadeDuration);
  }

  // ---------- 跳过 ----------
  function showSkipModal() {
    if (isTransitioning) return;
    if (skipModalVisible) return;
    const scene = story[sceneIndex];
    if (!scene) return;
    $skipSummary.textContent = scene.summary || '（暂无简略剧情）';
    $skipModalOverlay.classList.add('show');
    skipModalVisible = true;
    clearTypingTimer();
    clearAutoTimer();
  }

  function hideSkipModalAndAdvance() {
    if (!skipModalVisible) return;
    $skipModalOverlay.classList.remove('show');
    skipModalVisible = false;
    nextScene();
  }

  // ---------- 倍速 ----------
  function setSpeed(newSpeed) {
    speed = newSpeed;
    $speedBtns.forEach(function(btn) {
      const s = parseInt(btn.dataset.speed, 10);
      btn.classList.toggle('active', s === newSpeed);
    });
    if (isTyping) { restartTyping(); return; }
    if (speed < 2) {
      clearAutoTimer();
    } else {
      if ($continueHint.style.display === 'block') scheduleAutoAdvance();
    }
  }

  // ---------- 屏幕方向 ----------
  function tryLockLandscape() {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(function(err) {
        console.log('屏幕方向锁定失败（可忽略）:', err.message);
      });
    }
  }

  // ---------- 初始化 ----------
  function init() {
    preloadCharas();
    if (story.length > 0) {
      setBackground(story[0].bg);
      switchBgm(story[0].bgm || '');
    }
    setSpeed(1);
    dialogueIndex = 0;
    startDialogue();
  }

  // ---------- 事件 ----------
  $game.addEventListener('click', function(e) {
    if (e.target.closest('#top-bar')) return;
    if (e.target.closest('#skip-modal-overlay')) return;
    handleDialogueClick();
  });

  $skipBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    showSkipModal();
  });

  $skipModalOverlay.addEventListener('click', function(e) {
    e.stopPropagation();
    hideSkipModalAndAdvance();
  });

  $speedBtns.forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const s = parseInt(btn.dataset.speed, 10);
      setSpeed(s);
    });
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      handleDialogueClick();
    }
  });

  document.addEventListener('touchmove', function(e) {
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('pointerdown', unlockBgm, { once: true, passive: true });
  document.addEventListener('keydown', unlockBgm, { once: true });

  init();
})();
</script>
</body>
</html>
